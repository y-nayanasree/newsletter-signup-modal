<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Signup Modal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <div class="icon">💌</div>
        <h1>Stay in the Loop!</h1>
        <p>Get the latest updates, news, and exclusive offers delivered to your inbox.</p>
        <button id="openModal" class="primary-btn">Subscribe Now</button>
    </main>

    <div id="newsletterModal" class="modal" aria-hidden="true">
        <div class="modal-overlay" id="modalOverlay"></div>

        <section class="modal-content" role="dialog"
            aria-modal="true" aria-labelledby="modalTitle">
            <button id="closeModal" class="close-btn"
                type="button" aria-label="Close modal">&times;</button>

            <div class="icon">📬</div>
            <h2 id="modalTitle">Join Our Newsletter</h2>
            <p class="modal-description">
                Subscribe to receive our latest news and updates!
            </p>

            <form id="signupForm">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >
                <p id="errorMessage" class="error-message"></p>
                <button type="submit" class="primary-btn">Subscribe</button>
            </form>

            <p id="successMessage" class="success-message" aria-live="polite"></p>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
